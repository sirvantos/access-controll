      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: search
          description: Optional part of the company name or BIN. Matching ignores letter case and surrounding spaces and applies before pagination.
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Companies with activation state and whether the first admin is still pending.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
                  links:
                    type: object
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    head:
      summary: List every company.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: search
          description: Optional part of the company name or BIN. Matching ignores letter case and surrounding spaces and applies before pagination.
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Companies with activation state and whether the first admin is still pending.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      summary: Create a company and invite its first company admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, first_admin_email]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                first_admin_email:
                  type: string
                  format: email
                time_zone:
                  type: string
                  default: Asia/Almaty
                bin:
                  type: string
                contact_person:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 32
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        "201":
          description: The company exists and the first-admin invitation was queued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
